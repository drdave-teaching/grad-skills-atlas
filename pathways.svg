<g><rect x="750" y="284" width="176" height="60" rx="12" fill="#FAEEDA" stroke="#BA7517"/><text x="766" y="311" font-size="17" font-weight="700" fill="#633806">OPIM 5509</text><text x="766" y="330" font-size="11" fill="#854F0B">Deep Learning</text></g>
<g><rect x="990" y="284" width="176" height="60" rx="12" fill="#E1F5EE" stroke="#0F766E"/><text x="1006" y="311" font-size="17" font-weight="700" fill="#085041">OPIM 5516</text><text x="1006" y="330" font-size="11" fill="#0F6E56">Advanced Deep Learning</text></g>

<!-- Specializations -->
<g><rect x="390" y="496" width="176" height="60" rx="12" fill="#EAF3DE" stroke="#047857"/><text x="406" y="523" font-size="17" font-weight="700" fill="#27500A">OPIM 5502</text><text x="406" y="542" font-size="11" fill="#3B6D11">Big Data · PySpark</text></g>
<g><rect x="630" y="496" width="176" height="60" rx="12" fill="#FAECE7" stroke="#E0701A"/><text x="646" y="523" font-size="17" font-weight="700" fill="#712B13">OPIM 5641</text><text x="646" y="542" font-size="11" fill="#993C1D">Optimization / Decision Modeling</text></g>

<text x="830" y="532" font-size="11" fill="#A9A79E" font-style="italic">standalone electives — draw on the shared core</text>
</svg>
